name: Mainland Windows EXE
on:
  workflow_dispatch:
  push:
    paths:
      - "apps/**.py"
      - "tests/test_mainland_*.py"
      - ".github/workflows/mainland-exe.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: freelancer
            source: apps/自由职业催款管理工具.py
            test: tests/test_mainland_freelancer_tool.py
            exe: MainlandFreelancerTool
          - key: sales
            source: apps/轻量销售客户跟进工具.py
            test: tests/test_mainland_sales_tool.py
            exe: MainlandSalesFollowupTool
          - key: jobs
            source: apps/求职申请管理Pro.py
            test: tests/test_mainland_jobs.py
            exe: MainlandJobTrackerPro
          - key: finance
            source: apps/小微企业经营收支管理.py
            test: tests/test_mainland_finance.py
            exe: MainlandSmallBusinessFinance
          - key: meetings
            source: apps/会议行动项管理.py
            test: tests/test_mainland_meetings.py
            exe: MainlandMeetingActions
          - key: sop
            source: apps/SOP项目执行管理.py
            test: tests/test_mainland_sop.py
            exe: MainlandSOPManager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyinstaller
      - name: Automated regression tests
        run: python -m pytest -q ${{ matrix.test }}
      - name: Source self-test
        run: python "${{ matrix.source }}" --self-test
      - name: Build EXE
        run: pyinstaller --onefile --windowed --name "${{ matrix.exe }}" "${{ matrix.source }}"
      - name: EXE startup check
        shell: powershell
        run: |
          if (!(Test-Path "dist/${{ matrix.exe }}.exe")) { throw "EXE missing" }
          $p = Start-Process -FilePath "dist/${{ matrix.exe }}.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "EXE self-test failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: mainland-${{ matrix.key }}-windows
          path: dist/${{ matrix.exe }}.exe
