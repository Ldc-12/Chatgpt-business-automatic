name: Mainland Windows EXE
concurrency:
  group: mainland-windows-exe-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/**.py"
      - "tests/test_mainland_*.py"
      - "src/**.py"
      - "tools/issue_license.py"
      - "tools/export_license_public_key.py"
      - "tools/write_mainland_readme.py"
      - "tests/test_mainland_packaging.py"
      - ".github/workflows/mainland-exe.yml"
      - "docs/manuals/**"
      - "requirements.txt"
  push:
    branches: [main]
    paths:
      - "apps/**.py"
      - "tests/test_mainland_*.py"
      - "src/**.py"
      - "tools/issue_license.py"
      - "tools/export_license_public_key.py"
      - "tools/write_mainland_readme.py"
      - "tests/test_mainland_packaging.py"
      - ".github/workflows/mainland-exe.yml"
      - "docs/manuals/**"
      - "requirements.txt"
permissions:
  contents: read
  actions: read
jobs:
  build:
    timeout-minutes: 25
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: freelancer
            product: "自由职业催款管理工具"
            source: apps/自由职业催款管理工具.py
            test: tests/test_mainland_freelancer_tool.py
            exe: MainlandFreelancerTool
            manual: 04-自由职业催款管理工具-用户说明书.md
          - key: sales
            product: "轻量销售客户跟进工具"
            source: apps/轻量销售客户跟进工具.py
            test: tests/test_mainland_sales_tool.py
            exe: MainlandSalesFollowupTool
            manual: 05-轻量销售客户跟进工具-用户说明书.md
          - key: jobs
            product: "求职申请管理Pro"
            source: apps/求职申请管理Pro.py
            test: tests/test_mainland_jobs.py
            exe: MainlandJobTrackerPro
            manual: 06-求职申请管理Pro-用户说明书.md
          - key: finance
            product: "小微企业经营收支管理"
            source: apps/小微企业经营收支管理.py
            test: tests/test_mainland_finance.py
            exe: MainlandSmallBusinessFinance
            manual: 07-小微企业经营收支管理-用户说明书.md
          - key: meetings
            product: "会议行动项管理"
            source: apps/会议行动项管理.py
            test: tests/test_mainland_meetings.py
            exe: MainlandMeetingActions
            manual: 08-会议行动项管理-用户说明书.md
          - key: sop
            product: "SOP项目执行管理"
            source: apps/SOP项目执行管理.py
            test: tests/test_mainland_sop.py
            exe: MainlandSOPManager
            manual: 09-SOP项目执行管理-用户说明书.md
          - key: launcher
            product: "实用效率工具箱"
            source: apps/实用效率工具箱.py
            test: tests/test_mainland_launcher.py
            exe: MainlandEfficiencyToolbox
            manual: 00-实用效率工具箱-用户说明书.md
          - key: file-organizer
            product: "文件整理助手 Pro"
            source: apps/文件整理助手Pro.py
            test: tests/test_mainland_file_organizer.py
            exe: MainlandFileOrganizerPro
            manual: 01-文件整理助手Pro-用户说明书.md
          - key: image-tool
            product: "图片批量处理助手 Pro"
            source: apps/图片批量处理助手Pro.py
            test: tests/test_mainland_image_tool.py
            exe: MainlandImageToolPro
            manual: 02-图片批量处理助手Pro-用户说明书.md
          - key: pdf-tool
            product: "PDF批量工具 Pro"
            source: apps/PDF批量工具Pro.py
            test: tests/test_mainland_pdf_tool.py
            exe: MainlandPDFToolPro
            manual: 03-PDF批量工具Pro-用户说明书.md
          - key: inventory
            product: "小店库存盘点助手"
            source: apps/小店库存盘点助手.py
            test: tests/test_mainland_inventory.py
            exe: MainlandInventoryAssistant
            manual: 10-小店库存盘点助手-用户说明书.md
          - key: food-batch
            product: "食品批次与保质期追踪助手"
            source: apps/食品批次与保质期追踪助手.py
            test: tests/test_mainland_food_batch.py
            exe: MainlandFoodBatchExpiryAssistant
            manual: 19-食品批次与保质期追踪助手-用户说明书.md
          - key: purchase-compare
            product: "供应商采购比价助手"
            source: apps/供应商采购比价助手.py
            test: tests/test_mainland_purchase_compare.py
            exe: MainlandPurchaseCompare
            manual: 11-供应商采购比价助手-用户说明书.md
          - key: quotation
            product: "报价单生成器"
            source: apps/报价单生成器.py
            test: tests/test_mainland_quotation.py
            exe: MainlandQuotationGenerator
            manual: 12-报价单生成器-用户说明书.md
          - key: expense-reimbursement
            product: "费用报销管理助手"
            source: apps/费用报销管理助手.py
            test: tests/test_mainland_expense_reimbursement.py
            exe: MainlandExpenseReimbursement
            manual: 13-费用报销管理助手-用户说明书.md
          - key: repair-work-order
            product: "售后维修工单管理助手"
            source: apps/售后维修工单管理助手.py
            test: tests/test_mainland_repair_work_orders.py
            exe: MainlandRepairWorkOrderManager
            manual: 14-售后维修工单管理助手-用户说明书.md
          - key: after-sales-evidence
            product: "售后纠纷证据链管理助手"
            source: apps/售后纠纷证据链管理助手.py
            test: tests/test_mainland_after_sales_evidence.py
            exe: MainlandAfterSalesEvidenceAssistant
            manual: 20-售后纠纷证据链管理助手-用户说明书.md
          - key: store-schedule
            product: "门店排班考勤助手"
            source: apps/门店排班考勤助手.py
            test: tests/test_mainland_store_schedule.py
            exe: MainlandStoreScheduleAssistant
            manual: 15-门店排班考勤助手-用户说明书.md
          - key: contract-ledger
            product: "合同台账与到期提醒助手"
            source: apps/合同台账与到期提醒助手.py
            test: tests/test_mainland_contract_ledger.py tests/test_mainland_contract_document_parser.py
            exe: MainlandContractLedgerAssistant
            manual: 16-合同台账与到期提醒助手-用户说明书.md
          - key: construction-settlement
            product: "装修工程签证与进度款管理助手"
            source: apps/装修工程签证与进度款管理助手.py
            test: tests/test_mainland_construction_project.py
            exe: MainlandConstructionSettlementAssistant
            manual: 17-装修工程签证与进度款管理助手-用户说明书.md
          - key: rental-ledger
            product: "物业租金与押金管理助手"
            source: apps/物业租金与押金管理助手.py
            test: tests/test_mainland_rental_ledger.py
            exe: MainlandRentalLedgerAssistant
            manual: 18-物业租金与押金管理助手-用户说明书.md
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Automated regression tests
        run: python -m pytest -q ${{ matrix.test }} tests/test_mainland_license.py tests/test_mainland_packaging.py tests/test_mainland_series_packages.py
      - name: Source self-test
        run: python "${{ matrix.source }}" --self-test
      - name: Build EXE with ReportLab support
        if: matrix.key == 'quotation'
        run: pyinstaller --onefile --windowed --paths . --hidden-import src.license --collect-submodules reportlab --name "${{ matrix.exe }}" "${{ matrix.source }}"
      - name: Build standard EXE
        if: matrix.key != 'quotation'
        run: pyinstaller --onefile --windowed --paths . --hidden-import src.license --name "${{ matrix.exe }}" "${{ matrix.source }}"
      - name: Frozen EXE self-test (must exit successfully)
        shell: powershell
        run: |
          $exe = Join-Path $PWD "dist/${{ matrix.exe }}.exe"
          if (!(Test-Path $exe)) { throw "EXE missing: $exe" }
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $exe
          $psi.WorkingDirectory = $PWD.Path
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $psi.EnvironmentVariables["MAINLAND_EXE_SELF_TEST"] = "1"
          $p = [System.Diagnostics.Process]::Start($psi)
          if (!$p.WaitForExit(30000)) {
            $p.Kill()
            $p.WaitForExit()
            throw "Frozen EXE self-test timed out after 30 seconds."
          }
          if ($p.ExitCode -ne 0) {
            throw "Frozen EXE self-test failed with exit code $($p.ExitCode)."
          }
          Write-Host "FROZEN_EXE_SELF_TEST_OK: process exited with code 0."
      - name: Create UTF-8 mainland README
        run: python tools/write_mainland_readme.py --product "${{ matrix.product }}"
      - name: Create standalone delivery ZIP
        run: python -c "import zipfile; z=zipfile.ZipFile('dist/${{ matrix.exe }}-mainland.zip','w',zipfile.ZIP_DEFLATED); z.write('dist/${{ matrix.exe }}.exe','${{ matrix.exe }}.exe'); z.write('dist/README-mainland.txt','README-mainland.txt'); z.write('docs/manuals/${{ matrix.manual }}','说明书/${{ matrix.manual }}'); z.close()"
      - uses: actions/upload-artifact@v4
        with:
          name: mainland-${{ matrix.key }}-windows
          path: |
            dist/${{ matrix.exe }}.exe
            dist/${{ matrix.exe }}-mainland.zip

  package:
    name: Phase 1 customer delivery package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mainland-*-windows
          path: release
          merge-multiple: true
      - name: Build five independent category series packages
        run: python tools/build_mainland_series_packages.py --release-dir release --manuals-dir docs/manuals --output-dir release/series
      - name: Upload independent category series packages
        uses: actions/upload-artifact@v4
        with:
          name: mainland-phase1-series-packages
          path: |
            release/series/*.zip
            release/series/系列套餐目录.md
      - name: Create catalog and combined package
        shell: bash
        run: |
          cat > release/README-大陆版.md <<'EOF'
          # 第一阶段 Windows 工具包

          本包包含 21 款 Windows EXE（20 款业务工具及工具箱启动器）。
          使用方式：双击对应 EXE 即可运行。
          数据默认保存在当前 Windows 用户的 %LOCALAPPDATA%/MainlandBusinessTools。
          工具本地运行，不要求 ChatGPT、VPN 或外部 AI 服务。
          首次运行会显示设备码；购买后由卖家为每款产品提供专属授权文件。请将对应的“产品名.json”放入 %LOCALAPPDATA%/MainlandBusinessTools/licenses/（例如“小店库存盘点助手.json”“食品批次与保质期追踪助手.json”“售后纠纷证据链管理助手.json”“供应商采购比价助手.json”“报价单生成器.json”“费用报销管理助手.json”“售后维修工单管理助手.json”“门店排班考勤助手.json”“合同台账与到期提醒助手.json”“装修工程签证与进度款管理助手.json”“物业租金与押金管理助手.json”）。每款产品的授权文件分开保存。
          EOF
          mkdir -p release/package
          mkdir -p release/package/说明书
          cp docs/manuals/*.md release/package/说明书/
          cp docs/MAINLAND_SERIES_PACKAGES.md release/package/分类套餐目录.md
          cat > release/套餐说明.txt <<'EOF'
          系列 A｜办公效率系列｜建议售价 29.9 元
          文件整理助手 Pro、图片批量处理助手 Pro、PDF 批量工具 Pro、会议行动项管理、SOP 项目执行管理。

          系列 B｜门店经营系列｜建议售价 29.9 元
          小店库存盘点助手、食品批次与保质期追踪助手、供应商采购比价助手、售后维修工单管理助手、售后纠纷证据链管理助手、门店排班考勤助手。

          系列 C｜财务与交易系列｜建议售价 29.9 元
          自由职业催款管理工具、小微企业经营收支管理、报价单生成器、费用报销管理助手。

          系列 D｜合同工程物业系列｜建议售价 29.9 元
          合同台账与到期提醒助手、装修工程签证与进度款管理助手、物业租金与押金管理助手。

          系列 E｜客户与个人事务系列｜建议售价 19.9 元
          轻量销售客户跟进工具、求职申请管理 Pro。

          系列 F｜全系列综合套餐｜建议售价 39.9 元
          全部 20 款业务工具 + 工具箱启动器。

          以上均为待市场验证的建议售价，不代表实际成交价。分类 ZIP 独立提供，每款软件附对应中文说明书；全系列包保留全部软件及说明书。
          EOF
          cp release/*.exe release/package/
          cp release/README-大陆版.md release/套餐说明.txt release/package/
          cd release
          zip -r Phase1-Mainland-Windows-Tools.zip package
      - uses: actions/upload-artifact@v4
        with:
          name: mainland-phase1-customer-package
          path: |
            release/Phase1-Mainland-Windows-Tools.zip
            release/README-大陆版.md
      - name: Create bounded download chunks and checksum manifest
        shell: bash
        run: |
          package="release/Phase1-Mainland-Windows-Tools.zip"
          sha256sum "$package" > release/Phase1-Mainland-Windows-Tools.zip.sha256
          bytes=$(stat -c '%s' "$package")
          printf '%s\n' "$bytes" > release/Phase1-Mainland-Windows-Tools.zip.bytes
          split -b 18m -d -a 2 "$package" "release/Phase1-Mainland-Windows-Tools.zip.part-"
          parts=(release/Phase1-Mainland-Windows-Tools.zip.part-*)
          parts_count=${#parts[@]}
          if [ "$parts_count" -gt 20 ]; then
            echo "Package exceeds the supported 20 x 18 MiB chunk size."
            exit 1
          fi
          printf 'file=Phase1-Mainland-Windows-Tools.zip\nbytes=%s\nsha256=%s\nparts=%s\npart_size=18MiB\n' "$bytes" "$(cut -d' ' -f1 release/Phase1-Mainland-Windows-Tools.zip.sha256)" "$parts_count" > release/Phase1-Mainland-Windows-Tools.manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mainland-phase1-package-manifest
          path: |
            release/Phase1-Mainland-Windows-Tools.zip.sha256
            release/Phase1-Mainland-Windows-Tools.zip.bytes
            release/Phase1-Mainland-Windows-Tools.manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mainland-phase1-package-parts
          path: release/Phase1-Mainland-Windows-Tools.zip.part-*
          if-no-files-found: error
          compression-level: 0

# release-trigger

# delivery-build-trigger-v8
