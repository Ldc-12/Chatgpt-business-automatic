name: Mainland Windows EXE
concurrency:
  group: mainland-windows-exe
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    paths:
      - "apps/**.py"
      - "tests/test_mainland_*.py"
      - "src/**.py"
      - "tools/issue_license.py"
      - ".github/workflows/mainland-exe.yml"
      - "docs/manuals/**"
permissions:
  contents: read
  actions: read
jobs:
  build:
    timeout-minutes: 25
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: freelancer
            source: apps/自由职业催款管理工具.py
            test: tests/test_mainland_freelancer_tool.py
            exe: MainlandFreelancerTool
          - key: sales
            source: apps/轻量销售客户跟进工具.py
            test: tests/test_mainland_sales_tool.py
            exe: MainlandSalesFollowupTool
          - key: jobs
            source: apps/求职申请管理Pro.py
            test: tests/test_mainland_jobs.py
            exe: MainlandJobTrackerPro
          - key: finance
            source: apps/小微企业经营收支管理.py
            test: tests/test_mainland_finance.py
            exe: MainlandSmallBusinessFinance
          - key: meetings
            source: apps/会议行动项管理.py
            test: tests/test_mainland_meetings.py
            exe: MainlandMeetingActions
          - key: sop
            source: apps/SOP项目执行管理.py
            test: tests/test_mainland_sop.py
            exe: MainlandSOPManager
          - key: launcher
            source: apps/实用效率工具箱.py
            test: tests/test_mainland_launcher.py
            exe: MainlandEfficiencyToolbox
          - key: file-organizer
            source: apps/文件整理助手Pro.py
            test: tests/test_mainland_file_organizer.py
            exe: MainlandFileOrganizerPro
          - key: image-tool
            source: apps/图片批量处理助手Pro.py
            test: tests/test_mainland_image_tool.py
            exe: MainlandImageToolPro
          - key: pdf-tool
            source: apps/PDF批量工具Pro.py
            test: tests/test_mainland_pdf_tool.py
            exe: MainlandPDFToolPro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Automated regression tests
        run: python -m pytest -q ${{ matrix.test }}
      - name: Source self-test
        run: python "${{ matrix.source }}" --self-test
      - name: Build EXE
        run: pyinstaller --onefile --windowed --name "${{ matrix.exe }}" "${{ matrix.source }}"
      - name: EXE launch smoke check
        shell: powershell
        run: |
          if (!(Test-Path "dist/${{ matrix.exe }}.exe")) { throw "EXE missing" }
          $p = Start-Process -FilePath "dist/${{ matrix.exe }}.exe" -ArgumentList "--self-test" -PassThru
          Start-Sleep -Seconds 8
          if (!$p.HasExited) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Write-Host "EXE launched successfully; stopped after 8s smoke window."
          } else {
            Write-Host "EXE self-test exited with code $($p.ExitCode)."
          }
      - name: Create standalone delivery ZIP
        shell: powershell
        run: |
          $readme = @"
          ${{ matrix.exe }}
          Windows 单机版｜大陆版

          双击 EXE 即可运行。数据默认保存在当前用户的 %LOCALAPPDATA%\\MainlandBusinessTools 目录。
          本工具无需 ChatGPT、VPN 或外部 AI 服务。
          首次使用建议：先添加一条测试数据，确认保存、编辑、删除和 CSV 导出正常，再录入正式数据。
          "@
          Set-Content -Path "dist/README-mainland.txt" -Value $readme -Encoding UTF8
          python -c "import zipfile; z=zipfile.ZipFile('dist/${{ matrix.exe }}-mainland.zip','w',zipfile.ZIP_DEFLATED); z.write('dist/${{ matrix.exe }}.exe','${{ matrix.exe }}.exe'); z.write('dist/README-mainland.txt','README-mainland.txt'); z.close()"
      - uses: actions/upload-artifact@v4
        with:
          name: mainland-${{ matrix.key }}-windows
          path: |
            dist/${{ matrix.exe }}.exe
            dist/${{ matrix.exe }}-mainland.zip

  package:
    name: Phase 1 customer delivery package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mainland-*-windows
          path: release
          merge-multiple: true
      - name: Create catalog and combined package
        shell: bash
        run: |
          cat > release/README-大陆版.md <<'EOF'
          # 第一阶段 Windows 工具包

          本包包含 10 款 Windows EXE（含工具箱启动器）。
          使用方式：双击对应 EXE 即可运行。
          数据默认保存在当前 Windows 用户的 %LOCALAPPDATA%/MainlandBusinessTools。
          工具本地运行，不要求 ChatGPT、VPN 或外部 AI 服务。
          首次运行会显示设备码；购买后由卖家提供专属 license.json，放入 %LOCALAPPDATA%/MainlandBusinessTools/。
          EOF
          mkdir -p release/package
          mkdir -p release/package/说明书
          cp docs/manuals/*.md release/package/说明书/
          cat > release/套餐说明.txt <<'EOF'
          套餐 A｜电脑文件处理三件套｜建议售价 19.9 元
          文件整理 + 图片批处理 + PDF 批处理

          套餐 B｜办公效率工具箱｜建议售价 29.9 元
          套餐 A + 催款 + 客户跟进 + 求职管理

          套餐 C｜全能工作效率工具箱｜建议售价 39.9 元
          全部 9 款实用工具 + 工具箱启动器

          建议：低价单品用于引流，套餐用于提高客单价；具体售价上线后根据咨询和成交数据调整。
          EOF
          cp release/*.exe release/package/
          cp release/README-大陆版.md release/套餐说明.txt release/package/
          cd release
          zip -r Phase1-Mainland-Windows-Tools.zip package
      - uses: actions/upload-artifact@v4
        with:
          name: mainland-phase1-customer-package
          path: |
            release/Phase1-Mainland-Windows-Tools.zip
            release/README-大陆版.md

