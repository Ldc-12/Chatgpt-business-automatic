name: Mainland Windows EXE
concurrency:
  group: mainland-windows-exe
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    paths:
      - "apps/**.py"
      - "tests/test_mainland_*.py"
      - "src/**.py"
      - "tools/issue_license.py"
      - "tools/write_mainland_readme.py"
      - "tests/test_mainland_packaging.py"
      - ".github/workflows/mainland-exe.yml"
      - "docs/manuals/**"
permissions:
  contents: read
  actions: read
jobs:
  build:
    timeout-minutes: 25
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: freelancer
            source: apps/自由职业催款管理工具.py
            test: tests/test_mainland_freelancer_tool.py
            exe: MainlandFreelancerTool
          - key: sales
            source: apps/轻量销售客户跟进工具.py
            test: tests/test_mainland_sales_tool.py
            exe: MainlandSalesFollowupTool
          - key: jobs
            source: apps/求职申请管理Pro.py
            test: tests/test_mainland_jobs.py
            exe: MainlandJobTrackerPro
          - key: finance
            source: apps/小微企业经营收支管理.py
            test: tests/test_mainland_finance.py
            exe: MainlandSmallBusinessFinance
          - key: meetings
            source: apps/会议行动项管理.py
            test: tests/test_mainland_meetings.py
            exe: MainlandMeetingActions
          - key: sop
            source: apps/SOP项目执行管理.py
            test: tests/test_mainland_sop.py
            exe: MainlandSOPManager
          - key: launcher
            source: apps/实用效率工具箱.py
            test: tests/test_mainland_launcher.py
            exe: MainlandEfficiencyToolbox
          - key: file-organizer
            source: apps/文件整理助手Pro.py
            test: tests/test_mainland_file_organizer.py
            exe: MainlandFileOrganizerPro
          - key: image-tool
            source: apps/图片批量处理助手Pro.py
            test: tests/test_mainland_image_tool.py
            exe: MainlandImageToolPro
          - key: pdf-tool
            source: apps/PDF批量工具Pro.py
            test: tests/test_mainland_pdf_tool.py
            exe: MainlandPDFToolPro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Automated regression tests
        run: python -m pytest -q ${{ matrix.test }} tests/test_mainland_license.py tests/test_mainland_packaging.py
      - name: Source self-test
        run: python "${{ matrix.source }}" --self-test
      - name: Build EXE
        run: pyinstaller --onefile --windowed --name "${{ matrix.exe }}" "${{ matrix.source }}"
      - name: EXE launch smoke check
        shell: powershell
        run: |
          if (!(Test-Path "dist/${{ matrix.exe }}.exe")) { throw "EXE missing" }
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = (Join-Path $PWD "dist/${{ matrix.exe }}.exe")
          $psi.Arguments = "--self-test"
          $psi.WorkingDirectory = $PWD.Path
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $psi.EnvironmentVariables["MAINLAND_EXE_SELF_TEST"] = "1"
          $p = [System.Diagnostics.Process]::Start($psi)
          Write-Host "Started frozen EXE self-test (PID=$($p.Id), args=$($psi.Arguments), env=MAINLAND_EXE_SELF_TEST=1)."
          if (!$p.WaitForExit(30000)) {
            $p.Kill()
            throw "EXE self-test timed out after 30 seconds."
          }
          if ($p.ExitCode -ne 0) {
            throw "EXE self-test failed with exit code $($p.ExitCode)."
          }
          Write-Host "EXE self-test passed with exit code 0."
      - name: Create UTF-8 mainland README
        run: python tools/write_mainland_readme.py --product "${{ matrix.exe }}"
      - name: Create standalone delivery ZIP
        run: python -c "import zipfile; z=zipfile.ZipFile('dist/${{ matrix.exe }}-mainland.zip','w',zipfile.ZIP_DEFLATED); z.write('dist/${{ matrix.exe }}.exe','${{ matrix.exe }}.exe'); z.write('dist/README-mainland.txt','README-mainland.txt'); z.close()"
      - uses: actions/upload-artifact@v4
        with:
          name: mainland-${{ matrix.key }}-windows
          path: |
            dist/${{ matrix.exe }}.exe
            dist/${{ matrix.exe }}-mainland.zip

  package:
    name: Phase 1 customer delivery package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mainland-*-windows
          path: release
          merge-multiple: true
      - name: Create catalog and combined package
        shell: bash
        run: |
          cat > release/README-大陆版.md <<'EOF'
          # 第一阶段 Windows 工具包

          本包包含 10 款 Windows EXE（含工具箱启动器）。
          使用方式：双击对应 EXE 即可运行。
          数据默认保存在当前 Windows 用户的 %LOCALAPPDATA%/MainlandBusinessTools。
          工具本地运行，不要求 ChatGPT、VPN 或外部 AI 服务。
          首次运行会显示设备码；购买后由卖家为每款产品提供专属授权文件。请将对应的“产品名.json”放入 %LOCALAPPDATA%/MainlandBusinessTools/licenses/（例如“文件整理助手 Pro.json”）。每款产品的授权文件分开保存。
          EOF
          mkdir -p release/package
          mkdir -p release/package/说明书
          cp docs/manuals/*.md release/package/说明书/
          cat > release/套餐说明.txt <<'EOF'
          套餐 A｜电脑文件处理三件套｜建议售价 19.9 元
          文件整理 + 图片批处理 + PDF 批处理

          套餐 B｜办公效率工具箱｜建议售价 29.9 元
          套餐 A + 催款 + 客户跟进 + 求职管理

          套餐 C｜全能工作效率工具箱｜建议售价 39.9 元
          全部 9 款实用工具 + 工具箱启动器

          建议：低价单品用于引流，套餐用于提高客单价；具体售价上线后根据咨询和成交数据调整。
          EOF
          cp release/*.exe release/package/
          cp release/README-大陆版.md release/套餐说明.txt release/package/
          cd release
          zip -r Phase1-Mainland-Windows-Tools.zip package
      - uses: actions/upload-artifact@v4
        with:
          name: mainland-phase1-customer-package
          path: |
            release/Phase1-Mainland-Windows-Tools.zip
            release/README-大陆版.md
      - name: Create bounded download chunks and checksum manifest
        shell: bash
        run: |
          package="release/Phase1-Mainland-Windows-Tools.zip"
          sha256sum "$package" > release/Phase1-Mainland-Windows-Tools.zip.sha256
          bytes=$(stat -c '%s' "$package")
          printf '%s\n' "$bytes" > release/Phase1-Mainland-Windows-Tools.zip.bytes
          split -b 20m -d -a 2 "$package" "release/Phase1-Mainland-Windows-Tools.zip.part-"
          parts=(release/Phase1-Mainland-Windows-Tools.zip.part-*)
          if [ "${#parts[@]}" -gt 7 ]; then
            echo "Package exceeds the supported 7 x 20 MiB chunk size."
            exit 1
          fi
          for part in 00 01 02 03 04 05 06; do
            file="release/Phase1-Mainland-Windows-Tools.zip.part-$part"
            if [ ! -f "$file" ]; then : > "$file"; fi
          done
          printf 'file=Phase1-Mainland-Windows-Tools.zip\nbytes=%s\nsha256=%s\nparts=7\npart_size=20MiB\n' "$bytes" "$(cut -d' ' -f1 release/Phase1-Mainland-Windows-Tools.zip.sha256)" > release/Phase1-Mainland-Windows-Tools.manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mainland-phase1-package-manifest
          path: |
            release/Phase1-Mainland-Windows-Tools.zip.sha256
            release/Phase1-Mainland-Windows-Tools.zip.bytes
            release/Phase1-Mainland-Windows-Tools.manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mainland-phase1-package-part-00
          path: release/Phase1-Mainland-Windows-Tools.zip.part-00
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: mainland-phase1-package-part-01
          path: release/Phase1-Mainland-Windows-Tools.zip.part-01
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: mainland-phase1-package-part-02
          path: release/Phase1-Mainland-Windows-Tools.zip.part-02
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: mainland-phase1-package-part-03
          path: release/Phase1-Mainland-Windows-Tools.zip.part-03
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: mainland-phase1-package-part-04
          path: release/Phase1-Mainland-Windows-Tools.zip.part-04
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: mainland-phase1-package-part-05
          path: release/Phase1-Mainland-Windows-Tools.zip.part-05
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: mainland-phase1-package-part-06
          path: release/Phase1-Mainland-Windows-Tools.zip.part-06
          if-no-files-found: error
          compression-level: 0

# release-trigger

# delivery-build-trigger-v7
