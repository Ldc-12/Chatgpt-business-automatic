name: Mainland Windows EXE
on:
  workflow_dispatch:
  push:
    paths:
      - "apps/**.py"
      - "tests/test_mainland_*.py"
      - ".github/workflows/mainland-exe.yml"
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: freelancer
            source: apps/自由职业催款管理工具.py
            test: tests/test_mainland_freelancer_tool.py
            exe: MainlandFreelancerTool
          - key: sales
            source: apps/轻量销售客户跟进工具.py
            test: tests/test_mainland_sales_tool.py
            exe: MainlandSalesFollowupTool
          - key: jobs
            source: apps/求职申请管理Pro.py
            test: tests/test_mainland_jobs.py
            exe: MainlandJobTrackerPro
          - key: finance
            source: apps/小微企业经营收支管理.py
            test: tests/test_mainland_finance.py
            exe: MainlandSmallBusinessFinance
          - key: meetings
            source: apps/会议行动项管理.py
            test: tests/test_mainland_meetings.py
            exe: MainlandMeetingActions
          - key: sop
            source: apps/SOP项目执行管理.py
            test: tests/test_mainland_sop.py
            exe: MainlandSOPManager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyinstaller
      - name: Automated regression tests
        run: python -m pytest -q ${{ matrix.test }}
      - name: Source self-test
        run: python "${{ matrix.source }}" --self-test
      - name: Build EXE
        run: pyinstaller --onefile --windowed --name "${{ matrix.exe }}" "${{ matrix.source }}"
      - name: EXE startup check
        shell: powershell
        run: |
          if (!(Test-Path "dist/${{ matrix.exe }}.exe")) { throw "EXE missing" }
          $p = Start-Process -FilePath "dist/${{ matrix.exe }}.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "EXE self-test failed with exit code $($p.ExitCode)" }
      - name: Create standalone delivery ZIP
        shell: powershell
        run: |
          $readme = @"
          ${{ matrix.exe }}
          Windows 单机版｜大陆版

          双击 EXE 即可运行。数据默认保存在当前用户的 %LOCALAPPDATA%\\MainlandBusinessTools 目录。
          本工具无需 ChatGPT、VPN 或外部 AI 服务。
          首次使用建议：先添加一条测试数据，确认保存、编辑、删除和 CSV 导出正常，再录入正式数据。
          "@
          Set-Content -Path "dist/README-mainland.txt" -Value $readme -Encoding UTF8
          python -c "import zipfile; z=zipfile.ZipFile('dist/${{ matrix.exe }}-mainland.zip','w',zipfile.ZIP_DEFLATED); z.write('dist/${{ matrix.exe }}.exe','${{ matrix.exe }}.exe'); z.write('dist/README-mainland.txt','README-mainland.txt'); z.close()"
      - uses: actions/upload-artifact@v4
        with:
          name: mainland-${{ matrix.key }}-windows
          path: |
            dist/${{ matrix.exe }}.exe
            dist/${{ matrix.exe }}-mainland.zip

  package:
    name: Phase 1 customer delivery package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mainland-*-windows
          path: release
          merge-multiple: true
      - name: Create catalog and combined package
        shell: bash
        run: |
          cat > release/README-大陆版.md <<'EOF'
          # 第一阶段 Windows 工具包

          本包包含 6 款独立 Windows EXE。
          使用方式：双击对应 EXE 即可运行。
          数据默认保存在当前 Windows 用户的 %LOCALAPPDATA%/MainlandBusinessTools。
          工具本地运行，不要求 ChatGPT、VPN 或外部 AI 服务。
          EOF
          mkdir -p release/package
          cp release/*.exe release/package/
          cp release/README-大陆版.md release/package/
          cd release
          zip -r Phase1-Mainland-Windows-Tools.zip package
      - uses: actions/upload-artifact@v4
        with:
          name: mainland-phase1-customer-package
          path: |
            release/Phase1-Mainland-Windows-Tools.zip
            release/README-大陆版.md
