name: Windows EXE Build
on:
  workflow_dispatch:
  push:
    paths:
      - "apps/**"
      - "tests/test_freelancer_toolkit.py"
      - "requirements.txt"
      - ".github/workflows/windows-exe.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_freelancer_toolkit.py
  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name FreelancerInvoiceKit apps/freelancer_toolkit.py
      - name: Smoke check
        shell: powershell
        run: if (!(Test-Path "dist/FreelancerInvoiceKit.exe")) { throw "EXE missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: FreelancerInvoiceKit-windows
          path: dist/FreelancerInvoiceKit.exe
