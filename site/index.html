<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Micro Product Lab</title>
<style>
body{font-family:system-ui;max-width:900px;margin:40px auto;padding:0 20px;line-height:1.6}
article{border:1px solid #ddd;border-radius:14px;padding:24px;margin:18px 0}
.cta{display:inline-block;padding:10px 15px;border:1px solid #222;border-radius:9px;text-decoration:none;color:inherit}
.price{font-size:1.2rem;font-weight:700}
</style>
</head>
<body>
<h1>Micro Product Lab</h1>
<p>Practical digital tools and kits for measurable productivity improvements.</p>
<div id="app">Loading…</div>
<script>
fetch("products.json")
.then(r=>{if(!r.ok)throw new Error("catalog unavailable");return r.json()})
.then(ps=>{
  app.innerHTML=ps.map(p=>'<article><h2>'+p.name+'</h2><p>'+p.tagline+'</p><p><strong>For:</strong> '+p.target_user+'</p><p class="price">US$'+p.price_usd+' one-time</p><p><strong>Ready for sale</strong> · checkout link will be connected after marketplace listing.</p><a class="cta" href="products/'+encodeURIComponent(p.slug)+'/">View product</a></article>').join("");
})
.catch(()=>app.textContent="Product catalog is temporarily unavailable.");
</script>
</body>
</html>
