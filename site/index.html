<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Micro Product Lab</title><style>body{font-family:system-ui;max-width:900px;margin:40px auto;padding:0 20px;line-height:1.5}article{border:1px solid #ddd;border-radius:12px;padding:20px;margin:16px 0}a{color:inherit}.cta{display:inline-block;padding:8px 12px;border:1px solid #222;border-radius:8px;text-decoration:none}small{color:#666}</style></head>
<body><h1>Micro Product Lab</h1><p>Small practical action kits generated from current productivity and developer signals.</p><p><strong>Free validation edition:</strong> use a kit, measure the result, and tell us what should become a paid version.</p><div id="app">Loading…</div>
<script>fetch("products.json").then(r=>r.json()).then(ps=>{app.innerHTML=ps.map(p=>'<article><h2>'+p.name+'</h2><p>'+p.description+'</p><p><strong>Free validation edition</strong></p><a class="cta" href="products/'+p.slug+'/">Open product</a> &nbsp; <a href="products/'+p.slug+'/action-kit.md">Action Kit</a><br><small>Validation score: '+p.score+'</small></article>').join("")}).catch(()=>app.textContent="No products generated yet.");</script>
</body></html>
